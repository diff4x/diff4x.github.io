财也大，产也大，后来子孙祸也大，若问此理是若何，子孙钱多胆也大，天样大事都不怕，不丧身家不肯罢；财也小，产也小，后来子孙祸也小，若问此理是若何，子孙钱少胆也小，些微产业知自保



昂首攀南斗, 翻身依北辰, 举头天外望, 无我这般人



借少了, 你是他孙子, 借多了, 他反而成了你的孙子



享清福不在为官, 只要囊有钱, 仓有粟, 腹有诗书, 便是山中宰相, 祈大年无须服药, 但愿身无病, 心无忧, 门无债主, 即称得上是地上神仙



官职是朝廷的名器

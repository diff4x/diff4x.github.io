  <span id="anchor">20250809134728-书摘</span>
  <pre>
“四川、陕西两界相接之地，自定天下以来，番汉顽民多潜遁山谷间，不供征徭，不惧法度”


项忠杀伐远甚于白圭，“兵刃所加，无分玉石”


草木盛而变为矛戟，猿鹿多而化为豺鼠


不被统治的艺术

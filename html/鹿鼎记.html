  <pre>
少小须勤学, 文章可立身, 满朝朱紫贵, 尽是读书人


弱女飘零，祸不单行


贴加官


用兵之道, 示之以柔, 而赢之以刚, 示之以弱, 而乘之以强, 张欲西, 而示之以东


蠹众而木折, 隙大而墙坏


心灵丰盛, 已言足矣


冰雪迷人


宁得罪君子, 莫得罪小人


三五七千烦恼丝


迟则生变


祝融之灾


变成人棍之后, 把你种在土里, 有空就帮你浇浇水施施肥的, 说不定一两个月后就会长出胳膊和腿来的


妻子岂应关大计，英雄无奈是多情。


斩竹莫伤笋


拯救这些被推下火坑的奇女子

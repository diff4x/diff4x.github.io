<!DOCTYPE html>
<html lang="zh-CN" data-ui="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TXT Viewer</title>
<style>
@charset "UTF-8";
@import url("../css/font.css");

:root {
    --reader-bg: #f7f5f0;
    --reader-fg: #2c2a27;
    --col-rule: rgba(44, 42, 39, 0.1);
    --col-width: 440px;
    --col-gap: 64px;
    --font-size: 18px;
    --line-height: 1.85;

    --ui-bg: #fbfaf7;
    --ui-fg: #2c2a27;
    --ui-muted: #76716a;
    --ui-border: #ddd8ce;
    --ui-hover: #efece4;
    --ui-active-bg: #2c2a27;
    --ui-active-fg: #fbfaf7;
    --ui-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    --progress-color: rgba(60, 54, 46, 0.36);
    --scroll-thumb: rgba(60, 54, 46, 0.22);
    --scroll-thumb-hover: rgba(60, 54, 46, 0.45);
}

:root[data-ui="dark"] {
    --ui-bg: #22252a;
    --ui-fg: #d6dae0;
    --ui-muted: #8b929c;
    --ui-border: #363a42;
    --ui-hover: #2d3138;
    --ui-active-bg: #d6dae0;
    --ui-active-fg: #1b1d21;
    --ui-shadow: 0 6px 20px rgba(0, 0, 0, 0.42);
    --progress-color: rgba(214, 218, 224, 0.35);
    --scroll-thumb: rgba(214, 218, 224, 0.2);
    --scroll-thumb-hover: rgba(214, 218, 224, 0.42);
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--reader-bg);
    color: var(--reader-fg);
    font-family: 'Noto Serif SC', Georgia, "Songti SC", serif;
    transition: background-color 0.2s ease, color 0.2s ease;
}

/* 极简素色进度条 */
#progressBar {
    position: fixed;
    top: 0;
    left: 0;
    height: 2px;
    width: 0%;
    background: var(--progress-color);
    z-index: 900;
    pointer-events: none;
    transition: width 0.08s linear;
}

#readerViewport {
    position: fixed;
    inset: 0;
    padding: 30px 44px 30px 44px;
    box-sizing: border-box;
    overflow: hidden;
}

#readerStage {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    padding: 0 2px 10px 2px;
    overflow-x: auto;
    overflow-y: hidden;
    column-width: var(--col-width);
    column-gap: var(--col-gap);
    column-fill: auto;
    column-rule: 1px solid var(--col-rule);
    font-size: var(--font-size);
    line-height: var(--line-height);
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: break-word;
    text-align: justify;
    outline: none;
    scroll-behavior: auto;
}

#readerStage::-webkit-scrollbar {
    height: 7px;
}
#readerStage::-webkit-scrollbar-track {
    background: transparent;
}
#readerStage::-webkit-scrollbar-thumb {
    background-color: var(--scroll-thumb);
    border-radius: 4px;
}
#readerStage::-webkit-scrollbar-thumb:hover {
    background-color: var(--scroll-thumb-hover);
}

.txt-chunk {
    display: block;
    margin: 0;
    padding: 0;
}

.txt-loading {
    color: var(--ui-muted);
    font-size: 15px;
    padding: 12px 0;
}

#statusHud {
    position: fixed;
    left: 44px;
    right: 44px;
    bottom: 6px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    color: var(--reader-fg);
    opacity: 0.45;
    pointer-events: none;
    user-select: none;
    z-index: 20;
    gap: 16px;
}
#hudChapter {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
#hudRight {
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
}

/* 焦点提示框（素雅暖琥珀） */
.txt-hit-pulse {
    position: fixed;
    pointer-events: none;
    border: 1.5px solid #c26d1f;
    background: rgba(217, 119, 6, 0.16);
    border-radius: 3px;
    z-index: 950;
    animation: txtHitPulse 1.05s ease-out forwards;
}
@keyframes txtHitPulse {
    0% { transform: scale(1.14); opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
}

/* 拼音浮窗 & 摘抄按钮（纸墨素雅风） */
#pinyinTooltip {
    position: fixed;
    display: none;
    background: var(--ui-active-bg);
    color: var(--ui-active-fg);
    padding: 4px 10px;
    border-radius: 4px;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    pointer-events: none;
    z-index: 10000;
    box-shadow: var(--ui-shadow);
}

#excerptBtn {
    position: fixed;
    display: none;
    background: var(--ui-bg);
    color: var(--ui-fg);
    border: 1px solid var(--ui-border);
    padding: 3px 9px;
    border-radius: 4px;
    font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    font-size: 12px;
    cursor: pointer;
    z-index: 10001;
    user-select: none;
    box-shadow: var(--ui-shadow);
}
#excerptBtn:hover {
    background: var(--ui-hover);
}

/* 顶部呼出热区与把手 */
#barTrigger {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 16px;
    z-index: 960;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}
#barTrigger .trigger-pill {
    width: 44px;
    height: 3px;
    border-radius: 2px;
    background: var(--progress-color);
    opacity: 0.55;
    transition: width 0.2s ease, opacity 0.2s ease;
}
#barTrigger:hover .trigger-pill {
    width: 64px;
    opacity: 1;
}

/* 顶部横条控制栏 */
#topBar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: var(--ui-bg);
    color: var(--ui-fg);
    border-bottom: 1px solid var(--ui-border);
    box-shadow: var(--ui-shadow);
    font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    font-size: 12.5px;
    z-index: 980;
    transform: translateY(-105%);
    transition: transform 0.2s ease;
    user-select: none;
}
#topBar.open {
    transform: translateY(0);
}

.tb-inner {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px 10px;
    padding: 7px 14px;
}

.tb-group {
    display: inline-flex;
    align-items: center;
    gap: 5px;
}
.tb-sep {
    width: 1px;
    height: 16px;
    background: var(--ui-border);
    flex-shrink: 0;
}

.tb-meta {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    max-width: 210px;
    min-width: 0;
}
#fileTitle {
    font-weight: 600;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
#fileMetaSub {
    font-size: 11px;
    color: var(--ui-muted);
    white-space: nowrap;
    flex-shrink: 0;
}

.tb-btn {
    font: inherit;
    font-size: 12px;
    line-height: 1.3;
    padding: 3px 9px;
    border-radius: 4px;
    border: 1px solid var(--ui-border);
    background: transparent;
    color: var(--ui-fg);
    cursor: pointer;
    white-space: nowrap;
}
.tb-btn:hover {
    background: var(--ui-hover);
}
.tb-btn.active {
    background: var(--ui-active-bg);
    color: var(--ui-active-fg);
    border-color: var(--ui-active-bg);
}

.tb-slider-wrap {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--ui-muted);
}
.tb-slider-wrap input[type="range"] {
    width: 68px;
    height: 14px;
    margin: 0;
    cursor: pointer;
    accent-color: var(--ui-fg);
}
.tb-val {
    min-width: 32px;
    font-size: 11.5px;
    color: var(--ui-fg);
    font-variant-numeric: tabular-nums;
}
.tb-num {
    width: 44px;
    padding: 1px 4px;
    border: 1px solid var(--ui-border);
    border-radius: 3px;
    background: transparent;
    color: var(--ui-fg);
    font: inherit;
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    text-align: center;
    outline: none;
    box-sizing: border-box;
    user-select: text;
    -moz-appearance: textfield;
}
.tb-num:focus {
    border-color: var(--ui-fg);
    background: var(--ui-hover);
}
.tb-num::-webkit-inner-spin-button,
.tb-num::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
}
.tb-unit {
    font-size: 11px;
    color: var(--ui-muted);
    margin-left: -2px;
}

.tb-color {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 12px;
    color: var(--ui-muted);
    cursor: pointer;
}
.tb-color input[type="color"] {
    width: 20px;
    height: 20px;
    padding: 0;
    border: 1px solid var(--ui-border);
    border-radius: 3px;
    background: transparent;
    cursor: pointer;
}

select.tb-select {
    font: inherit;
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--ui-border);
    background: var(--ui-bg);
    color: var(--ui-fg);
    outline: none;
    cursor: pointer;
}

.tb-right {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

/* 顶部横条下拉浮层（目录 / 书签共用） */
.tb-popover {
    position: fixed;
    top: 44px;
    width: 340px;
    max-width: calc(100vw - 24px);
    max-height: min(68vh, 520px);
    background: var(--ui-bg);
    color: var(--ui-fg);
    border: 1px solid var(--ui-border);
    border-radius: 6px;
    box-shadow: var(--ui-shadow);
    z-index: 985;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    user-select: none;
}
.tb-popover[hidden] {
    display: none;
}

.pop-head {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--ui-border);
    font-size: 12.5px;
    font-weight: 600;
}
.pop-search {
    flex: 1;
    min-width: 0;
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid var(--ui-border);
    background: transparent;
    color: var(--ui-fg);
    font: inherit;
    font-size: 12px;
    font-weight: normal;
    outline: none;
}
.pop-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 6px;
}
.pop-body::-webkit-scrollbar { width: 5px; }
.pop-body::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 3px; }

.pop-empty {
    padding: 20px 10px;
    text-align: center;
    font-size: 12px;
    color: var(--ui-muted);
}

.toc-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 12.5px;
    cursor: pointer;
}
.toc-item:hover { background: var(--ui-hover); }
.toc-item.active {
    background: var(--ui-hover);
    font-weight: 600;
}
.toc-item-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.toc-item-pct {
    flex-shrink: 0;
    font-size: 11px;
    color: var(--ui-muted);
    font-variant-numeric: tabular-nums;
}

.bm-item {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    padding: 7px 8px;
    border-radius: 4px;
    cursor: pointer;
    border-bottom: 1px dashed var(--ui-border);
}
.bm-item:last-child { border-bottom: 0; }
.bm-item:hover { background: var(--ui-hover); }
.bm-main {
    flex: 1;
    min-width: 0;
}
.bm-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
}
.bm-ch {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.bm-pct {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: normal;
    color: var(--ui-muted);
    font-variant-numeric: tabular-nums;
}
.bm-excerpt {
    margin-top: 3px;
    font-size: 12px;
    color: var(--ui-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.bm-time {
    margin-top: 2px;
    font-size: 10.5px;
    color: var(--ui-muted);
    opacity: 0.8;
}
.bm-del {
    flex-shrink: 0;
    border: 0;
    background: transparent;
    color: var(--ui-muted);
    font-size: 15px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 3px;
    cursor: pointer;
}
.bm-del:hover {
    background: var(--ui-border);
    color: var(--ui-fg);
}

@media (max-width: 720px) {
    #readerViewport { padding: 20px 18px 26px 18px; }
    #statusHud { left: 18px; right: 18px; }
}
</style>
</head>
<body>
    <div id="progressBar"></div>

    <div id="readerViewport">
        <div id="readerStage" tabindex="0"><div class="txt-loading">正在加载文档...</div></div>
    </div>

    <div id="statusHud">
        <span id="hudChapter"></span>
        <span id="hudRight">0.0%</span>
    </div>

    <div id="pinyinTooltip"></div>
    <div id="excerptBtn">✏️ 摘抄</div>

    <div id="barTrigger" title="点击呼出顶部控制条">
        <div class="trigger-pill"></div>
    </div>

    <header id="topBar" aria-label="TXT 阅读控制条">
        <div class="tb-inner">
            <div class="tb-meta">
                <span id="fileTitle">Loading...</span>
                <span id="fileMetaSub">--</span>
            </div>

            <span class="tb-sep"></span>

            <div class="tb-group">
                <button id="tocBtn" class="tb-btn" type="button" title="打开目录">目录</button>
                <button id="addBmBtn" class="tb-btn" type="button" title="为当前位置添加书签 (快捷键 B)">+ 书签</button>
                <button id="bmListBtn" class="tb-btn" type="button" title="查看本书书签">书签 (0)</button>
            </div>

            <span class="tb-sep"></span>

            <div class="tb-group">
                <span class="tb-slider-wrap" title="调整字号">
                    字号<input type="range" id="fontSizeSlider" min="13" max="34" step="1" value="18"><input type="number" id="fzInput" class="tb-num" min="10" max="60" step="1" value="18" aria-label="字号数值"><span class="tb-unit">px</span>
                </span>
                <span class="tb-slider-wrap" title="调整行高">
                    行高<input type="range" id="lineHeightSlider" min="1.3" max="2.6" step="0.05" value="1.85"><input type="number" id="lhInput" class="tb-num" min="1.0" max="4.0" step="0.05" value="1.85" aria-label="行高数值">
                </span>
                <span class="tb-slider-wrap" title="调整参考栏宽 (自动 1/2/3 栏)">
                    栏宽<input type="range" id="colWidthSlider" min="280" max="680" step="20" value="440"><input type="number" id="cwInput" class="tb-num" min="200" max="2000" step="10" value="440" aria-label="栏宽数值">
                </span>
            </div>

            <span class="tb-sep"></span>

            <div class="tb-group">
                <button class="tb-btn preset-btn" data-theme="light" type="button">亮色</button>
                <button class="tb-btn preset-btn" data-theme="dark" type="button">暗色</button>
                <label class="tb-color" title="文字颜色">字<input type="color" id="fgColor"></label>
                <label class="tb-color" title="背景颜色">底<input type="color" id="bgColor"></label>
            </div>

            <span class="tb-sep"></span>

            <div class="tb-group">
                <select id="encodingSelect" class="tb-select" title="文件编码">
                    <option value="auto">编码: 自动</option>
                    <option value="utf-8">UTF-8</option>
                    <option value="gb18030">GB18030</option>
                    <option value="big5">Big5</option>
                    <option value="utf-16le">UTF-16LE</option>
                    <option value="utf-16be">UTF-16BE</option>
                </select>
                <button id="scopeToggleBtn" class="tb-btn" type="button" title="切换主站搜索框为搜本书或搜全站">搜本书</button>
            </div>

            <div class="tb-right">
                <button id="resetBtn" class="tb-btn" type="button" title="恢复默认排版与配色">重置</button>
                <button id="closeBarBtn" class="tb-btn" type="button" title="收起横条 (Esc)">▲</button>
            </div>
        </div>
    </header>

    <div id="tocPopover" class="tb-popover" hidden>
        <div class="pop-head">
            <span>目录</span>
            <input type="text" id="tocSearch" class="pop-search" placeholder="过滤章节...">
        </div>
        <div id="tocList" class="pop-body"></div>
    </div>

    <div id="bmPopover" class="tb-popover" hidden>
        <div class="pop-head">
            <span id="bmPopTitle">书签</span>
            <button id="clearBmBtn" class="tb-btn" type="button" style="font-size:11px;padding:1px 6px;">清空</button>
        </div>
        <div id="bmList" class="pop-body"></div>
    </div>

    <script src="../third/other/encoding.min.js"></script>
    <script type="module">
        import {
            searchHighlightSupported,
            getSearchHighlight,
            resetSearchHighlights,
            publishSearchHighlights,
            adaptKeywordsForWasm,
            collectAdsPositiveIndices,
            evalAdsExpr,
            mergeWasmMatchSpans,
            collectWasmMatches,
            buildMergedGroupSnippets
        } from '../js/shared-utils.js';
        import { BookDB, normalizeBookKey, buildBookSearchCacheKey } from '../js/book-db.js';

        if (window.top && window.top.VirtualCursor) {
            try { window.top.VirtualCursor.attach(window); } catch (_) { }
        }

        // =====================================================================
        // 1. BUS 通信与标签页隔离
        // =====================================================================
        const childId = 'content';
        window.childId = childId;
        if (window.__LITE_BUS__) window.__LITE_BUS__.close();
        window.__LITE_BUS__ = new BroadcastChannel('bus');
        const BUS = window.__LITE_BUS__;
        const ctxId = window.top === window.self ? 'index' : childId;

        const getTabId = () => {
            try { return (window.top && window.top.__TAB_ID__) || ''; } catch (_) { return ''; }
        };

        function emitEvent(type, payload, target = '*') {
            if (!window.__LITE_BUS__) return;
            try {
                window.__LITE_BUS__.postMessage({ type, payload, from: ctxId, target, tabId: getTabId() });
            } catch (_) { }
        }

        BUS.addEventListener('message', (e) => {
            const { type, payload, target, tabId } = e.data || {};
            const myTab = getTabId();
            if (tabId && myTab && tabId !== myTab) return;
            if (target !== '*' && target !== ctxId) return;
            if (type === 'SIM_POINTER' && typeof window.handleSimPointer === 'function') {
                window.handleSimPointer(payload);
            } else if (type === 'DESTROY_HIGHLIGHT') {
                clearAllSearchHighlights();
            }
        });

        // =====================================================================
        // 2. 存储与默认配置（仅亮色 / 暗色两套预设）
        // =====================================================================
        const PREFS_KEY = 'txt.history__prefs';
        const THEMES = {
            light: { bg: '#f7f5f0', fg: '#2c2a27' },
            dark:  { bg: '#1b1d21', fg: '#c8cdd5' }
        };
        const DEFAULT_PREFS = {
            fontSize: 18,
            lineHeight: 1.85,
            columnWidth: 440,
            color: THEMES.light.fg,
            backgroundColor: THEMES.light.bg,
            theme: 'light'
        };

        const readJSON = (k) => {
            try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }
            catch { return null; }
        };
        const writeJSON = (k, v) => {
            try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) { }
        };

        const $ = (s) => document.querySelector(s);
        const stage = $('#readerStage');
        const progressBar = $('#progressBar');
        const hudChapter = $('#hudChapter');
        const hudRight = $('#hudRight');
        const pinyinTooltip = $('#pinyinTooltip');
        const excerptBtn = $('#excerptBtn');
        const topBar = $('#topBar');
        const barTrigger = $('#barTrigger');
        const tocPopover = $('#tocPopover');
        const bmPopover = $('#bmPopover');
        const scopeToggleBtn = $('#scopeToggleBtn');

        const State = {
            fileUrl: '',
            bookKey: '',
            title: '',
            historyKey: '',
            rawBytes: null,
            detectedEncoding: 'utf-8',
            rawText: '',
            chapters: [],      // [{ index, title, startOffset, endOffset, percent }]
            chunks: [],        // [{ index, chapterIdx, startOffset, endOffset, text, el, textNode }]
            prefs: { ...DEFAULT_PREFS },
            history: { charOffset: 0, scrollLeft: 0, percent: 0, encoding: 'auto', bookmarks: [] },
            activeSearchToken: 0,
            lastSearch: null,
            searchScope: 'txt',
            provider: null
        };

        function debounce(fn, wait) {
            let t = null;
            return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
        }

        // =====================================================================
        // 3. 中文多编码自动识别与解码
        // =====================================================================
        const SIMPLIFIED_MARKERS = new Set(Array.from('的是不了人在有我他这个们中来上大为和国地到以说时要就出会可也你对生能而子那得于着下自之年过发后作里用道行所然家种事成方多经么去法学如都同现当没动面起看定天分还进好小部其些主样理心她本前开但因只从想实日军者意无力它与长把机十民第公此已工使情明性知全三又关点正业外将两高间由问很最重并物手应战向头文体政美相见被利什二等产或新己制身果加西斯月话合回特代内信表化老给世位次度门任常先海通教儿原东声提立及比员解水名真论处走义各入几口认条平系气题活尔更别打女变四神总何电数安少报才结反受目太量再感建务做接必场件计管期市直德资命山金指克许统区保至队形社便空决治展马科司五基眼书非则听白却界达光放强即像难且权思王象完设式色路记南品住告类求据程北边死张该交规万取拉格望觉术领共确传师观清今切院让识候带导争运笑飞风步改收根干造言联持组每济车亲极林服快办议往元英士证近失转夫令准布始怎呢存未远叫台单影具罗字爱击流备兵连调深商算质团红集百需价花党华城石级整府离况亚请技际约示复病息究线似官火断精满支视消越器容照须九增研写称企八功吗包片史委乎查轻易早曾除农找装广显吧阿李标谈吃图念六引历首医局突专费号另周较注语仅考落青随选列武红'));
        const TRADITIONAL_MARKERS = new Set(Array.from('這們為國時會來對個說發經過與學現動開實點業將兩間問點體產機經關從當還進種樣理無長張頭經變電數報結場計區隊達強難權設記類據領確傳觀識導爭運飛聯組濟車親極辦議證遠單影愛擊備調質團紅華級離況請際複斷滿視消器須研寫企易農裝廣顯標圖歷醫專費較註語僅考隨選'));
        const CN_PUNCT = new Set(Array.from('，。、“”！？：；（）《》【】—…、'));

        function scoreDecodedChinese(text, encodingName) {
            let bad = 0, ctrl = 0, cjk = 0, punct = 0, simp = 0, trad = 0;
            const len = Math.min(text.length, 16000);
            for (let i = 0; i < len; i++) {
                const code = text.charCodeAt(i);
                if (code === 0xFFFD) { bad++; continue; }
                if (code < 0x20 && code !== 0x09 && code !== 0x0A && code !== 0x0D) { ctrl++; continue; }
                if (code >= 0x4E00 && code <= 0x9FFF) {
                    cjk++;
                    const ch = text[i];
                    if (SIMPLIFIED_MARKERS.has(ch)) simp++;
                    if (TRADITIONAL_MARKERS.has(ch)) trad++;
                } else if (CN_PUNCT.has(text[i])) {
                    punct++;
                }
            }
            const langBonus = encodingName === 'gb18030' ? (simp * 2.2) : (trad * 2.6 + simp * 0.4);
            return cjk * 3 + punct * 5 + langBonus - bad * 120 - ctrl * 35;
        }

        function decodeChineseBuffer(arrayBuffer, forcedEncoding = 'auto') {
            const bytes = new Uint8Array(arrayBuffer);
            const clean = (s) => s.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');

            if (forcedEncoding && forcedEncoding !== 'auto') {
                try {
                    return { encoding: forcedEncoding, text: clean(new TextDecoder(forcedEncoding).decode(bytes)) };
                } catch (_) { }
            }

            if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
                return { encoding: 'utf-8', text: clean(new TextDecoder('utf-8').decode(bytes)) };
            }
            if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) {
                return { encoding: 'utf-16le', text: clean(new TextDecoder('utf-16le').decode(bytes)) };
            }
            if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) {
                return { encoding: 'utf-16be', text: clean(new TextDecoder('utf-16be').decode(bytes)) };
            }

            try {
                const utf8Text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
                return { encoding: 'utf-8', text: clean(utf8Text) };
            } catch (_) { }

            const probeLen = Math.min(bytes.length, 16384);
            let evenZeros = 0, oddZeros = 0;
            for (let i = 0; i < probeLen; i++) {
                if (bytes[i] === 0) {
                    if ((i & 1) === 0) evenZeros++;
                    else oddZeros++;
                }
            }
            const halfProbe = probeLen / 2;
            if (halfProbe > 32) {
                if (oddZeros / halfProbe > 0.25 && evenZeros / halfProbe < 0.03) {
                    return { encoding: 'utf-16le', text: clean(new TextDecoder('utf-16le').decode(bytes)) };
                }
                if (evenZeros / halfProbe > 0.25 && oddZeros / halfProbe < 0.03) {
                    return { encoding: 'utf-16be', text: clean(new TextDecoder('utf-16be').decode(bytes)) };
                }
            }

            const sample = bytes.subarray(0, Math.min(bytes.length, 32768));
            let bestEnc = 'gb18030';
            let bestScore = -Infinity;
            for (const enc of ['gb18030', 'big5']) {
                try {
                    const dec = new TextDecoder(enc).decode(sample);
                    const sc = scoreDecodedChinese(dec, enc);
                    if (sc > bestScore) { bestScore = sc; bestEnc = enc; }
                } catch (_) { }
            }
            try {
                return { encoding: bestEnc, text: clean(new TextDecoder(bestEnc).decode(bytes)) };
            } catch (_) { }

            if (window.Encoding) {
                try {
                    const detected = window.Encoding.detect(sample) || 'UTF8';
                    const unicodeArr = window.Encoding.convert(bytes, { to: 'UNICODE', from: detected });
                    return { encoding: String(detected).toLowerCase(), text: clean(window.Encoding.codeToString(unicodeArr)) };
                } catch (_) { }
            }
            return { encoding: 'utf-8', text: clean(new TextDecoder('utf-8').decode(bytes)) };
        }

        // =====================================================================
        // 4. 章节/分段解析与 DOM 分块渲染
        // =====================================================================
        const CHAPTER_RE = /^(?:(?:正文\s*)?第[零一二三四五六七八九十百千万两0-9]{1,9}[章回节卷部篇集幕话](?:[\s　:：·.\-—].{0,42})?|(?:卷[零一二三四五六七八九十百千万两0-9]{1,6}|Chapter\s*\d+|CHAPTER\s*\d+|Part\s*\d+|Section\s*\d+)(?:[\s　:：·.\-—].{0,42})?|(?:楔子|序章|序言|序幕|序|引子|前言|前记|尾声|终章|后记|番外(?:\s*[一二三四五六七八九十0-9]*)?)(?:[\s　:：·.\-—].{0,32})?)$/;

        function parseChaptersAndBuildChunks(text) {
            const totalLen = Math.max(1, text.length);
            const rawChapters = [];
            let lineStart = 0;

            while (lineStart < text.length) {
                let nl = text.indexOf('\n', lineStart);
                if (nl === -1) nl = text.length;
                const trimmed = text.slice(lineStart, nl).trim();
                if (trimmed.length >= 1 && trimmed.length <= 48 && CHAPTER_RE.test(trimmed)) {
                    rawChapters.push({ title: trimmed, startOffset: lineStart });
                }
                lineStart = nl + 1;
            }

            const chapters = [];
            if (rawChapters.length >= 2) {
                if (rawChapters[0].startOffset > 60) {
                    chapters.push({ index: 0, title: '序 / 开头', startOffset: 0, endOffset: rawChapters[0].startOffset });
                }
                for (let i = 0; i < rawChapters.length; i++) {
                    const start = rawChapters[i].startOffset;
                    const end = i + 1 < rawChapters.length ? rawChapters[i + 1].startOffset : text.length;
                    chapters.push({
                        index: chapters.length,
                        title: rawChapters[i].title,
                        startOffset: start,
                        endOffset: end
                    });
                }
            } else {
                const SEG_SIZE = 18000;
                let pos = 0, segNo = 1;
                while (pos < text.length) {
                    let next = Math.min(text.length, pos + SEG_SIZE);
                    if (next < text.length) {
                        const nl = text.indexOf('\n', next);
                        if (nl !== -1 && nl - next < 2000) next = nl + 1;
                    }
                    const pct = ((pos / totalLen) * 100).toFixed(1) + '%';
                    chapters.push({
                        index: chapters.length,
                        title: rawChapters.length === 1 && segNo === 1 ? rawChapters[0].title : `第 ${segNo} 段 (${pct})`,
                        startOffset: pos,
                        endOffset: next
                    });
                    pos = next;
                    segNo++;
                }
            }

            chapters.forEach(c => {
                c.percent = ((c.startOffset / totalLen) * 100).toFixed(1) + '%';
            });

            const CHUNK_TARGET = 36000;
            const chunks = [];
            const frag = document.createDocumentFragment();

            for (const ch of chapters) {
                let pos = ch.startOffset;
                while (pos < ch.endOffset) {
                    let end = Math.min(ch.endOffset, pos + CHUNK_TARGET);
                    if (end < ch.endOffset) {
                        const nl = text.indexOf('\n', end);
                        if (nl !== -1 && nl < ch.endOffset && nl - end < 3000) end = nl + 1;
                    }
                    const slice = text.slice(pos, end);
                    const div = document.createElement('div');
                    div.className = 'txt-chunk';
                    const tn = document.createTextNode(slice);
                    div.appendChild(tn);
                    div.dataset.chunkIdx = String(chunks.length);
                    frag.appendChild(div);
                    chunks.push({
                        index: chunks.length,
                        chapterIdx: ch.index,
                        startOffset: pos,
                        endOffset: end,
                        text: slice,
                        el: div,
                        textNode: tn
                    });
                    pos = end;
                }
            }

            stage.replaceChildren(frag);
            State.chapters = chapters;
            State.chunks = chunks;
            renderTocList();
        }

        // =====================================================================
        // 5. 字符偏移锚定
        // =====================================================================
        function getChunkAtOffset(charOffset) {
            const chunks = State.chunks;
            if (!chunks.length) return null;
            let lo = 0, hi = chunks.length - 1;
            while (lo <= hi) {
                const mid = (lo + hi) >> 1;
                const c = chunks[mid];
                if (charOffset < c.startOffset) hi = mid - 1;
                else if (charOffset >= c.endOffset) lo = mid + 1;
                else return c;
            }
            return chunks[Math.max(0, Math.min(chunks.length - 1, lo))];
        }

        function getChapterAtOffset(charOffset) {
            const chs = State.chapters;
            if (!chs.length) return null;
            let lo = 0, hi = chs.length - 1, ans = chs[0];
            while (lo <= hi) {
                const mid = (lo + hi) >> 1;
                if (chs[mid].startOffset <= charOffset) { ans = chs[mid]; lo = mid + 1; }
                else hi = mid - 1;
            }
            return ans;
        }

        function captureCurrentCharOffset() {
            const r = stage.getBoundingClientRect();
            const probePoints = [
                [r.left + 24, r.top + 28],
                [r.left + 64, r.top + 64],
                [r.left + 120, r.top + 100]
            ];
            for (const [px, py] of probePoints) {
                let node = null, offset = 0;
                if (document.caretRangeFromPoint) {
                    const cr = document.caretRangeFromPoint(px, py);
                    if (cr) { node = cr.startContainer; offset = cr.startOffset; }
                } else if (document.caretPositionFromPoint) {
                    const cp = document.caretPositionFromPoint(px, py);
                    if (cp) { node = cp.offsetNode; offset = cp.offset; }
                }
                if (node && node.nodeType === Node.TEXT_NODE && node.parentElement && node.parentElement.classList.contains('txt-chunk')) {
                    const cIdx = Number(node.parentElement.dataset.chunkIdx);
                    const chunk = State.chunks[cIdx];
                    if (chunk) return chunk.startOffset + Math.min(offset, chunk.text.length);
                }
            }
            const maxScroll = Math.max(1, stage.scrollWidth - stage.clientWidth);
            return Math.round((stage.scrollLeft / maxScroll) * State.rawText.length);
        }

        function scrollToCharOffset(charOffset, { smooth = false, align = 'left' } = {}) {
            const chunk = getChunkAtOffset(Math.max(0, Math.min(State.rawText.length - 1, charOffset)));
            if (!chunk || !chunk.textNode) return;
            const localOff = Math.max(0, Math.min(chunk.text.length - 1, charOffset - chunk.startOffset));
            try {
                const range = document.createRange();
                range.setStart(chunk.textNode, localOff);
                range.setEnd(chunk.textNode, Math.min(chunk.text.length, localOff + 1));
                const rect = range.getBoundingClientRect();
                const sr = stage.getBoundingClientRect();
                if (!rect || (rect.width === 0 && rect.height === 0)) return;
                let target = stage.scrollLeft + (rect.left - sr.left);
                if (align === 'center') target -= (sr.width - rect.width) / 2;
                else target -= 12;
                const maxScroll = Math.max(0, stage.scrollWidth - stage.clientWidth);
                target = Math.max(0, Math.min(maxScroll, target));
                if (smooth) animateHorizontalScrollTo(target);
                else {
                    cancelSmoothScroll();
                    stage.scrollLeft = target;
                    updateProgressHud();
                }
            } catch (_) { }
        }

        // =====================================================================
        // 6. 横向无缝滚动引擎
        // =====================================================================
        let scrollAnimRaf = null;
        let scrollTargetX = 0;

        function cancelSmoothScroll() {
            if (scrollAnimRaf) { cancelAnimationFrame(scrollAnimRaf); scrollAnimRaf = null; }
            scrollTargetX = stage.scrollLeft;
        }

        function animateHorizontalScrollTo(targetX) {
            const maxScroll = Math.max(0, stage.scrollWidth - stage.clientWidth);
            scrollTargetX = Math.max(0, Math.min(maxScroll, targetX));
            if (scrollAnimRaf) return;
            const step = () => {
                const diff = scrollTargetX - stage.scrollLeft;
                if (Math.abs(diff) <= 0.8) {
                    stage.scrollLeft = scrollTargetX;
                    scrollAnimRaf = null;
                    updateProgressHud();
                    return;
                }
                stage.scrollLeft += diff * 0.24;
                scrollAnimRaf = requestAnimationFrame(step);
            };
            scrollAnimRaf = requestAnimationFrame(step);
        }

        window.addEventListener('wheel', (e) => {
            if (e.target && e.target.closest && e.target.closest('.tb-popover, #topBar')) return;
            e.preventDefault();

            let dx = e.deltaX || 0;
            let dy = e.deltaY || 0;
            if (e.deltaMode === 1) { dx *= 40; dy *= 40; }
            else if (e.deltaMode === 2) { dx *= stage.clientWidth * 0.9; dy *= stage.clientWidth * 0.9; }

            if (Math.abs(dx) >= Math.abs(dy) && Math.abs(dx) > 0) {
                cancelSmoothScroll();
                stage.scrollLeft += dx;
            } else if (dy !== 0) {
                const isDiscreteWheel = Math.abs(dy) >= 40;
                if (isDiscreteWheel) {
                    const base = scrollAnimRaf ? scrollTargetX : stage.scrollLeft;
                    animateHorizontalScrollTo(base + dy * 1.35);
                } else {
                    cancelSmoothScroll();
                    stage.scrollLeft += dy * 1.1;
                }
            }
        }, { passive: false });

        function scrollByScreen(dir) {
            const base = scrollAnimRaf ? scrollTargetX : stage.scrollLeft;
            const step = Math.max(240, stage.clientWidth * 0.92);
            animateHorizontalScrollTo(base + dir * step);
        }

        document.addEventListener('keydown', (e) => {
            if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) {
                if (e.key === 'Escape') closeTopBarAndPopovers();
                return;
            }
            if (e.key === 'Escape') {
                if (topBar.classList.contains('open') || !tocPopover.hidden || !bmPopover.hidden) {
                    closeTopBarAndPopovers();
                }
                return;
            }
            if (e.key === '\\') {
                e.preventDefault();
                emitEvent('quick_search', '', 'index');
                return;
            }
            if ((e.key === 'b' || e.key === 'B') && !e.ctrlKey && !e.metaKey && !e.altKey) {
                e.preventDefault();
                addCurrentBookmark();
                return;
            }
            if (e.key === 'ArrowRight') { e.preventDefault(); animateHorizontalScrollTo((scrollAnimRaf ? scrollTargetX : stage.scrollLeft) + 220); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); animateHorizontalScrollTo((scrollAnimRaf ? scrollTargetX : stage.scrollLeft) - 220); }
            else if (e.key === 'PageDown' || (e.code === 'Space' && !e.shiftKey)) { e.preventDefault(); scrollByScreen(1); }
            else if (e.key === 'PageUp' || (e.code === 'Space' && e.shiftKey)) { e.preventDefault(); scrollByScreen(-1); }
            else if (e.key === 'Home') { e.preventDefault(); animateHorizontalScrollTo(0); }
            else if (e.key === 'End') { e.preventDefault(); animateHorizontalScrollTo(stage.scrollWidth); }
        });

        // =====================================================================
        // 7. 进度 HUD 与状态持久化（含书签列表）
        // =====================================================================
        let hudRaf = 0;
        let lastActiveChapterIdx = -1;

        function updateProgressHud() {
            hudRaf = 0;
            const maxScroll = Math.max(0, stage.scrollWidth - stage.clientWidth);
            const pct = maxScroll === 0 ? 0 : Math.min(100, Math.max(0, (stage.scrollLeft / maxScroll) * 100));
            progressBar.style.width = pct.toFixed(2) + '%';
            const approxPages = Math.max(1, Math.ceil(stage.scrollWidth / Math.max(1, stage.clientWidth)));
            const curPage = Math.min(approxPages, Math.max(1, Math.round(stage.scrollLeft / Math.max(1, stage.clientWidth)) + 1));
            hudRight.textContent = `${curPage}/${approxPages} · ${pct.toFixed(1)}%`;

            const off = Math.round((pct / 100) * State.rawText.length);
            const ch = getChapterAtOffset(off);
            if (ch) {
                hudChapter.textContent = ch.title;
                if (ch.index !== lastActiveChapterIdx) {
                    lastActiveChapterIdx = ch.index;
                    highlightActiveTocItem(ch.index);
                }
            }
        }

        function saveBookHistoryNow() {
            if (!State.historyKey || (window.top && window.top._isBombing)) return;
            const maxScroll = Math.max(1, stage.scrollWidth - stage.clientWidth);
            const charOffset = captureCurrentCharOffset();
            State.history = {
                charOffset,
                scrollLeft: Math.round(stage.scrollLeft),
                percent: Number(((stage.scrollLeft / maxScroll) * 100).toFixed(2)),
                encoding: State.history.encoding || 'auto',
                bookmarks: Array.isArray(State.history.bookmarks) ? State.history.bookmarks : [],
                updatedAt: Date.now()
            };
            writeJSON(State.historyKey, State.history);
        }

        const saveBookHistoryDebounced = debounce(saveBookHistoryNow, 400);

        stage.addEventListener('scroll', () => {
            if (!hudRaf) hudRaf = requestAnimationFrame(updateProgressHud);
            saveBookHistoryDebounced();
        }, { passive: true });

        // =====================================================================
        // 8. 书签功能（存入 txt.history_<书名>.bookmarks，随 @bomb/@rebirth 同步备份）
        // =====================================================================
        function formatBmTime(ts) {
            const d = new Date(ts);
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function extractExcerptAt(charOffset) {
            const text = State.rawText;
            if (!text) return '';
            let s = Math.max(0, Math.min(text.length, charOffset));
            while (s < text.length && /\s/.test(text[s])) s++;
            let e = Math.min(text.length, s + 36);
            const nl = text.indexOf('\n', s);
            if (nl !== -1 && nl < e && nl - s >= 6) e = nl;
            const snippet = text.slice(s, e).replace(/\s+/g, ' ').trim();
            return snippet || '(空白位置)';
        }

        function updateBookmarkCountUI() {
            const list = Array.isArray(State.history.bookmarks) ? State.history.bookmarks : [];
            $('#bmListBtn').textContent = `书签 (${list.length})`;
            $('#bmPopTitle').textContent = `书签 (${list.length})`;
            $('#clearBmBtn').style.display = list.length > 0 ? '' : 'none';
        }

        function renderBookmarkList() {
            updateBookmarkCountUI();
            const container = $('#bmList');
            container.textContent = '';
            const list = Array.isArray(State.history.bookmarks) ? State.history.bookmarks : [];
            if (list.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'pop-empty';
                empty.textContent = '暂无书签，点「+ 书签」或按 B 记录当前位置';
                container.appendChild(empty);
                return;
            }
            const frag = document.createDocumentFragment();
            list.forEach((bm) => {
                const row = document.createElement('div');
                row.className = 'bm-item';
                row.dataset.bmId = bm.id;

                const main = document.createElement('div');
                main.className = 'bm-main';

                const top = document.createElement('div');
                top.className = 'bm-top';
                const chSpan = document.createElement('span');
                chSpan.className = 'bm-ch';
                chSpan.textContent = bm.chapter || '正文';
                chSpan.title = bm.chapter || '';
                const pctSpan = document.createElement('span');
                pctSpan.className = 'bm-pct';
                pctSpan.textContent = bm.percent || '';
                top.append(chSpan, pctSpan);

                const ex = document.createElement('div');
                ex.className = 'bm-excerpt';
                ex.textContent = bm.excerpt || '';
                ex.title = bm.excerpt || '';

                const tm = document.createElement('div');
                tm.className = 'bm-time';
                tm.textContent = bm.createdAt ? formatBmTime(bm.createdAt) : '';

                main.append(top, ex, tm);

                const del = document.createElement('button');
                del.type = 'button';
                del.className = 'bm-del';
                del.textContent = '×';
                del.title = '删除书签';
                del.onclick = (e) => {
                    e.stopPropagation();
                    State.history.bookmarks = (State.history.bookmarks || []).filter(x => x.id !== bm.id);
                    saveBookHistoryNow();
                    renderBookmarkList();
                };

                row.onclick = () => {
                    scrollToCharOffset(bm.charOffset || 0, { smooth: true, align: 'left' });
                    closeTopBarAndPopovers();
                };

                row.append(main, del);
                frag.appendChild(row);
            });
            container.appendChild(frag);
        }

        function addCurrentBookmark() {
            if (!State.rawText) return;
            const charOffset = captureCurrentCharOffset();
            const ch = getChapterAtOffset(charOffset);
            const totalLen = Math.max(1, State.rawText.length);
            const percent = ((charOffset / totalLen) * 100).toFixed(1) + '%';
            const excerpt = extractExcerptAt(charOffset);
            const list = Array.isArray(State.history.bookmarks) ? State.history.bookmarks.slice() : [];

            const nearbyIdx = list.findIndex(b => Math.abs((b.charOffset || 0) - charOffset) < 80);
            const entry = {
                id: 'bm_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6),
                charOffset,
                chapter: ch ? ch.title : '正文',
                excerpt,
                percent,
                createdAt: Date.now()
            };
            if (nearbyIdx !== -1) list.splice(nearbyIdx, 1);
            list.unshift(entry);
            if (list.length > 200) list.length = 200;

            State.history.bookmarks = list;
            saveBookHistoryNow();
            renderBookmarkList();

        function hexLuminance(hex) {
            const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '');
            if (!m) return 200;
            return 0.299 * parseInt(m[1], 16) + 0.587 * parseInt(m[2], 16) + 0.114 * parseInt(m[3], 16);
        }

            State.searchScope = scope === 'global' ? 'global' : 'txt';
            const isGlobal = State.searchScope === 'global';

            scopeToggleBtn.classList.toggle('active', isGlobal);
            scopeToggleBtn.title = isGlobal
                ? '当前为全站搜索，点击切回搜本书'
                : '当前为搜本书，点击切换为搜全站';
        }

        function applyPrefs({ reanchor = false, skipInput = null } = {}) {
            const anchorOff = reanchor ? captureCurrentCharOffset() : null;
            const p = State.prefs;
            const rootEl = document.documentElement;
            const rootStyle = rootEl.style;
            rootStyle.setProperty('--font-size', p.fontSize + 'px');
            rootStyle.setProperty('--line-height', String(p.lineHeight));
            rootStyle.setProperty('--col-width', p.columnWidth + 'px');
            rootStyle.setProperty('--reader-fg', p.color);
            rootStyle.setProperty('--reader-bg', p.backgroundColor);

            const isDark = hexLuminance(p.backgroundColor) < 120;
            rootEl.dataset.ui = isDark ? 'dark' : 'light';
            rootStyle.setProperty('--col-rule', isDark ? 'rgba(255,255,255,0.08)' : 'rgba(44,42,39,0.1)');

            const syncSlider = (sliderEl, val) => {
                const min = Number(sliderEl.min), max = Number(sliderEl.max);
                sliderEl.value = String(Math.max(min, Math.min(max, val)));
            };
            syncSlider($('#fontSizeSlider'), p.fontSize);
            syncSlider($('#lineHeightSlider'), p.lineHeight);
            syncSlider($('#colWidthSlider'), p.columnWidth);

            const fzInput = $('#fzInput');
            const lhInput = $('#lhInput');
            const cwInput = $('#cwInput');
            if (skipInput !== fzInput) fzInput.value = String(p.fontSize);
            if (skipInput !== lhInput) lhInput.value = Number(p.lineHeight).toFixed(2);
            if (skipInput !== cwInput) cwInput.value = String(p.columnWidth);

                btn.classList.toggle('active', btn.dataset.theme === p.theme);

            function bindRangeAndNumber({ sliderId, inputId, prefKey, min, max, decimals = 0 }) {
                const slider = $(sliderId);
                const input = $(inputId);
                const normalize = (v) => {
                    const clamped = Math.max(min, Math.min(max, v));
                    return decimals > 0 ? Number(clamped.toFixed(decimals)) : Math.round(clamped);
                };

                slider.oninput = (e) => {

                input.onfocus = () => input.select();

                    if (!Number.isFinite(num) || num < min || num > max) return;
                    State.prefs[prefKey] = normalize(num);
                    applyPrefs({ reanchor: true, skipInput: input });
                    savePrefsDebounced();
                };

                const commit = () => {
                    const raw = input.value.trim();
                    const num = Number(raw);
                    if (raw !== '' && Number.isFinite(num)) {
                        State.prefs[prefKey] = normalize(num);
                        savePrefsDebounced();
                    }
                    applyPrefs({ reanchor: true });
                };

                input.onchange = commit;
                input.onblur = commit;
                input.onkeydown = (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        commit();
                        input.blur();
                    } else if (e.key === 'Escape') {
                        e.stopPropagation();
                        applyPrefs({ reanchor: false });
                        input.blur();

        function initSelectionTools() {
            let lastSelected = '';

            const hidePopups = () => {
                pinyinTooltip.style.display = 'none';
                excerptBtn.style.display = 'none';
            };

            const doExcerpt = () => {
                const sel = window.getSelection();
                const text = sel ? sel.toString().trim() : '';
                if (text.length < 2) return;
                emitEvent('SAVE_EXCERPT', text, 'index');
                excerptBtn.textContent = '✓ 已摘抄';
                setTimeout(() => {
                    excerptBtn.style.display = 'none';
                    excerptBtn.textContent = '✏️ 摘抄';
                    try { sel.removeAllRanges(); } catch (_) { }
                    lastSelected = '';
                }, 750);
            };

            excerptBtn.addEventListener('mousedown', (e) => { e.preventDefault(); e.stopPropagation(); });
            excerptBtn.addEventListener('click', (e) => { e.stopPropagation(); doExcerpt(); });

            document.addEventListener('mousedown', (e) => {
                if (e.target && e.target.closest && e.target.closest('#excerptBtn')) return;
                hidePopups();
            });

            document.addEventListener('mouseup', (e) => {
                if (e.target && e.target.closest && e.target.closest('#topBar, .tb-popover, #excerptBtn')) return;
                setTimeout(() => {
                    const sel = window.getSelection();
                    const text = sel ? sel.toString().trim() : '';
                    if (!text || !sel.rangeCount) {
                        hidePopups();
                        lastSelected = '';
                        return;
                    }
                    const rect = sel.getRangeAt(0).getBoundingClientRect();
                    if (!rect || (rect.width === 0 && rect.height === 0)) return;

                    const chars = Array.from(text);
                    if (chars.length === 1) {
                        const dict = window.top && window.top.pinyinData;
                        const py = dict && dict[chars[0]];
                        if (py) {
                            pinyinTooltip.textContent = py;
                            pinyinTooltip.style.display = 'block';
                            const tw = pinyinTooltip.offsetWidth || 60;
                            const left = Math.max(8, Math.min(window.innerWidth - tw - 8, rect.left + rect.width / 2 - tw / 2));
                            const top = Math.max(8, rect.top - 34);
                            pinyinTooltip.style.left = left + 'px';
                            pinyinTooltip.style.top = top + 'px';
                        } else {
                            pinyinTooltip.style.display = 'none';
                        }
                        excerptBtn.style.display = 'none';
                        lastSelected = text;
                        return;
                    }

                    pinyinTooltip.style.display = 'none';
                    if (text !== lastSelected) {
                        const getEndRect = () => {
                            try {
                                if (sel.focusNode) {
                                    const caret = document.createRange();
                                    caret.setStart(sel.focusNode, sel.focusOffset);
                                    caret.collapse(true);
                                    const cr = caret.getBoundingClientRect();
                                    if (cr && cr.height > 0) return cr;
                                    if (sel.focusNode.nodeType === Node.TEXT_NODE && sel.focusNode.length > 0) {
                                        const r2 = document.createRange();
                                        if (sel.focusOffset > 0) {
                                            r2.setStart(sel.focusNode, sel.focusOffset - 1);
                                            r2.setEnd(sel.focusNode, sel.focusOffset);
                                            const rr = r2.getBoundingClientRect();
                                            if (rr && rr.height > 0) return { left: rr.right, right: rr.right, top: rr.top, bottom: rr.bottom, width: 0, height: rr.height };
                                        } else {
                                            r2.setStart(sel.focusNode, 0);
                                            r2.setEnd(sel.focusNode, 1);
                                            const rr = r2.getBoundingClientRect();
                                            if (rr && rr.height > 0) return { left: rr.left, right: rr.left, top: rr.top, bottom: rr.bottom, width: 0, height: rr.height };
                                        }
                                    }
                                }
                            } catch (_) { }
                            try {
                                const rects = Array.from(sel.getRangeAt(0).getClientRects()).filter(r => r.width > 0 || r.height > 0);
                                if (rects.length > 0) {
                                    let isBackward = false;
                                    if (sel.anchorNode && sel.focusNode) {
                                        isBackward = sel.anchorNode === sel.focusNode
                                            ? sel.focusOffset < sel.anchorOffset
                                            : !!(sel.anchorNode.compareDocumentPosition(sel.focusNode) & Node.DOCUMENT_POSITION_PRECEDING);
                                    }
                                    const r = isBackward ? rects[0] : rects[rects.length - 1];
                                    const x = isBackward ? r.left : r.right;
                                    return { left: x, right: x, top: r.top, bottom: r.bottom, width: 0, height: r.height };
                                }
                            } catch (_) { }
                            return { left: e.clientX, right: e.clientX, top: e.clientY - 12, bottom: e.clientY + 6, width: 0, height: 18 };
                        };
                        const endRect = getEndRect();
                        excerptBtn.style.visibility = 'hidden';
                        excerptBtn.style.display = 'block';
                        const bw = excerptBtn.offsetWidth || 72;
                        const bh = excerptBtn.offsetHeight || 26;
                        const endX = (endRect.left + endRect.right) / 2;
                        const left = Math.max(8, Math.min(window.innerWidth - bw - 8, endX - bw / 2));
                        let top = endRect.bottom + 6;
                        if (top + bh > window.innerHeight - 8 && endRect.top - bh - 6 >= 8) {
                            top = endRect.top - bh - 6;
                        } else {
                            top = Math.max(8, Math.min(window.innerHeight - bh - 8, top));
                        }
                        excerptBtn.style.left = Math.round(left) + 'px';
                        excerptBtn.style.top = Math.round(top) + 'px';
                        excerptBtn.style.visibility = 'visible';
                        lastSelected = text;
                    }
                }, 10);
            });
        }

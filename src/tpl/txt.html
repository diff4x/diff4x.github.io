        async function waitForSharedWasm(timeoutMs = 5000) {
            const start = Date.now();
            while (Date.now() - start < timeoutMs) {
                const sw = window.top && window.top.sharedWasm;
                if (sw && sw.ready && typeof sw.find_content_matches_multi === 'function') return sw;
                if (sw && sw.failed) return null;
                await new Promise(r => setTimeout(r, 40));
            }
            return null;
        }

        function u16ToCodePointIdx(str, u16Idx) {
            const clamped = Math.max(0, Math.min(str.length, u16Idx));
            let cp = 0;
            for (let i = 0; i < clamped; i++) {
                const c = str.charCodeAt(i);
                if (c >= 0xD800 && c <= 0xDBFF && i + 1 < clamped) {
                    const n = str.charCodeAt(i + 1);
                    if (n >= 0xDC00 && n <= 0xDFFF) i++;
                }
                cp++;
            }
            return cp;
        }

        function buildCompactAnchorPreview(chunkText, localStart, localEnd, noise, allChunkHits = null) {
            const BEFORE = 10, AFTER = 18;
            let s = Math.max(0, localStart - BEFORE);
            let e = Math.min(chunkText.length, localEnd + AFTER);
            const prevNl = chunkText.lastIndexOf('\n', localStart - 1);
            if (prevNl >= s) s = prevNl + 1;
            const nextNl = chunkText.indexOf('\n', localEnd);
            if (nextNl !== -1 && nextNl < e) e = nextNl;

            const prefixEllipsis = s > 0 && chunkText[s - 1] !== '\n' ? '…' : '';
            const suffixEllipsis = e < chunkText.length && chunkText[e] !== '\n' ? '…' : '';
            const cleanSlice = chunkText.slice(s, e).replace(/[\t\r\n]/g, ' ');
            const preview = prefixEllipsis + cleanSlice + suffixEllipsis;
            const pShift = prefixEllipsis.length;

            if (Array.isArray(allChunkHits) && allChunkHits.length > 0) {
                const highlights = [];
                for (const m of allChunkHits) {
                    if (m.end <= s) continue;
                    if (m.start >= e) break;
                    const rs = pShift + (Math.max(s, m.start) - s);
                    const re = pShift + (Math.min(e, m.end) - s);
                    if (re > rs) {
                        highlights.push([u16ToCodePointIdx(preview, rs), u16ToCodePointIdx(preview, re), m.noise]);
                    }
                }
                if (highlights.length > 0) return { preview, highlights };
            }
            const hs = u16ToCodePointIdx(preview, pShift + (localStart - s));
            const he = u16ToCodePointIdx(preview, pShift + (localEnd - s));
            return { preview, highlights: [[hs, he, noise]] };
        }

        function buildSnippetItem(hit, radius = 64, extraHits = null) {
            const chunk = State.chunks[hit.chunkIdx];
            if (!chunk) return null;
            const text = chunk.text;
            let s = Math.max(0, hit.localStart - radius);
            let e = Math.min(text.length, hit.localEnd + radius);
            if (s > 0) {
                const nl = text.lastIndexOf('\n', hit.localStart - 1);
                if (nl !== -1 && hit.localStart - nl <= radius) s = nl + 1;
            }
            if (e < text.length) {
                const nl = text.indexOf('\n', hit.localEnd);
                if (nl !== -1 && nl - hit.localEnd <= radius) e = nl;
            }
            const pre = s > 0 && text[s - 1] !== '\n' ? '…' : '';
            const suf = e < text.length && text[e] !== '\n' ? '…' : '';
            const body = text.slice(s, e).replace(/[\t\r]/g, ' ');
            const t = pre + body + suf;
            const shift = pre.length;

            const h = [];
            const candidates = extraHits || [hit];
            for (const item of candidates) {
                if (item.chunkIdx !== hit.chunkIdx) continue;
                if (item.localEnd <= s || item.localStart >= e) continue;
                const rs = Math.max(s, item.localStart) - s + shift;
                const re = Math.min(e, item.localEnd) - s + shift;
                if (re > rs) h.push([rs, re, item.noise]);
            }
            return { t, h };
        }

        async function runBookSearch({ keyword, specs, noise, synonymsEnabled, adsPlan, token, cacheMeta }) {
            State.activeSearchToken = token;
            clearAllSearchHighlights();
            const isAds = !!(adsPlan && Array.isArray(adsPlan.terms) && adsPlan.terms.length > 0 && adsPlan.expr);
            if (!keyword || State.chunks.length === 0 || (!isAds && (!Array.isArray(specs) || specs.length === 0))) {
                State.lastSearch = null;
                return { totalHits: 0, shownHits: 0, truncated: false, groups: [] };
            }

            const useHL = searchHighlightSupported();
            const MAX_RECORDED_HITS = 1500;
            const MAX_HL_RANGES = 2000;

            const canCache = !!(State.bookKey && (!cacheMeta || cacheMeta.canCache !== false));
            const queryKey = canCache ? buildBookSearchCacheKey({
                bookSig: `txt:${State.detectedEncoding}:${State.rawText.length}`,
                algoVer: (cacheMeta && cacheMeta.algoVer) || 11,
                synVer: (cacheMeta && cacheMeta.synVer) || '',
                keyword,
                noise,
                useSyn: !!synonymsEnabled,
                adsPlan: isAds ? adsPlan : null
            }) : '';

            if (canCache && queryKey) {
                const cached = await BookDB.getSearch(State.bookKey, queryKey);
                if (token !== State.activeSearchToken) return null;
                if (cached && Array.isArray(cached.hits) && Array.isArray(cached.groupMeta)) {
                    const groupMap = new Map();
                    for (const gm of cached.groupMeta) {
                        groupMap.set(gm.groupIndex, {
                            type: 'txt-group',
                            path: `txt-group:${gm.groupIndex}`,
                            groupIndex: gm.groupIndex,
                            title: gm.title,
                            percent: gm.percent,
                            count: gm.count,
                            hits: []
                        });
                    }
                    let hlCount = 0;
                    for (const h of cached.hits) {
                        const g = groupMap.get(h.chapterIdx);
                        if (g) g.hits.push(h);
                        if (useHL && hlCount < MAX_HL_RANGES) {
                            const chunk = State.chunks[h.chunkIdx];
                            if (chunk && chunk.textNode && h.localEnd > h.localStart && h.localEnd <= chunk.text.length) {
                                try {
                                    const r = new Range();
                                    r.setStart(chunk.textNode, h.localStart);
                                    r.setEnd(chunk.textNode, h.localEnd);
                                    getSearchHighlight(h.noise).add(r);
                                    hlCount++;
                                } catch (_) { }
                            }
                        }
                    }
                    if (useHL) publishSearchHighlights();
                    const groups = Array.from(groupMap.values()).sort((a, b) => a.groupIndex - b.groupIndex);
                    State.lastSearch = { keyword, isAds, hits: cached.hits, groups, groupMap };
                    return {
                        keyword,
                        totalHits: cached.totalHits,
                        shownHits: cached.hits.length,
                        truncated: !!cached.truncated,
                        groups
                    };
                }
            }

            const sw = await waitForSharedWasm();
            if (token !== State.activeSearchToken) return null;
            if (!sw) throw new Error('Wasm 搜索引擎未就绪');
            const totalLen = Math.max(1, State.rawText.length);

            const hits = [];
            const groupMap = new Map();
            let totalHits = 0;
            let hlCount = 0;

            const recordChunkMatches = (chunk, ch, matchList) => {
                for (const m of matchList) {
                    const localStart = m.start;
                    const localEnd = m.end;
                    const packedNoise = m.noise;
                    totalHits++;

                    if (useHL && hlCount < MAX_HL_RANGES && localEnd > localStart && localEnd <= chunk.text.length) {
                        try {
                            const r = new Range();
                            r.setStart(chunk.textNode, localStart);
                            r.setEnd(chunk.textNode, localEnd);
                            getSearchHighlight(packedNoise).add(r);
                            hlCount++;
                        } catch (_) { }
                    }

                    const charStart = chunk.startOffset + localStart;
                    const charEnd = chunk.startOffset + localEnd;
                    const pct = ((charStart / totalLen) * 100).toFixed(1) + '%';

                    let g = groupMap.get(chunk.chapterIdx);
                    if (!g) {
                        g = {
                            type: 'txt-group',
                            path: `txt-group:${chunk.chapterIdx}`,
                            groupIndex: chunk.chapterIdx,
                            title: ch ? ch.title : `第 ${chunk.chapterIdx + 1} 节`,
                            percent: ch ? ch.percent : pct,
                            count: 0,
                            hits: []
                        };
                        groupMap.set(chunk.chapterIdx, g);
                    }
                    g.count++;

                    if (hits.length < MAX_RECORDED_HITS) {
                        const compact = buildCompactAnchorPreview(chunk.text, localStart, localEnd, packedNoise, matchList);
                        const hitObj = {
                            hitIndex: hits.length,
                            chunkIdx: chunk.index,
                            chapterIdx: chunk.chapterIdx,
                            localStart,
                            localEnd,
                            charStart,
                            charEnd,
                            noise: packedNoise,
                            termIdx: typeof m.termIdx === 'number' ? m.termIdx : 0,
                            percent: pct,
                            preview: compact.preview,
                            highlights: compact.highlights
                        };
                        hits.push(hitObj);
                        g.hits.push(hitObj);
                    }
                }
            };

            let sliceStart = performance.now();

            if (isAds) {
                const terms = adsPlan.terms.map(t => ({
                    noise: t.noise,
                    wasmKeywords: adaptKeywordsForWasm(t.specs, !!sw.weightedKeywords)
                }));
                const posIndices = collectAdsPositiveIndices(adsPlan.expr);
                const posSet = new Set(posIndices);

                const chunksByChapter = new Map();
                for (const c of State.chunks) {
                    let list = chunksByChapter.get(c.chapterIdx);
                    if (!list) { list = []; chunksByChapter.set(c.chapterIdx, list); }
                    list.push(c);
                }

                for (const ch of State.chapters) {
                    if (token !== State.activeSearchToken) return null;
                    const chChunks = chunksByChapter.get(ch.index);
                    if (!chChunks || chChunks.length === 0) continue;

                    const termHitCache = new Map();
                    const termMatchesByChunk = new Map();

                    const hasTermInChapter = (tIdx) => {
                        if (termHitCache.has(tIdx)) return termHitCache.get(tIdx);
                        const term = terms[tIdx];
                        if (!term || term.wasmKeywords.length === 0) {
                            termHitCache.set(tIdx, false);
                            return false;
                        }
                        const keepAll = posSet.has(tIdx);
                        let found = false;
                        let byChunk = null;
                        for (const chunk of chChunks) {
                            const matches = collectWasmMatches(sw, chunk.text, term.wasmKeywords, term.noise, tIdx);
                            if (matches.length > 0) {
                                found = true;
                                if (!keepAll) break;
                                if (!byChunk) { byChunk = new Map(); termMatchesByChunk.set(tIdx, byChunk); }
                                byChunk.set(chunk.index, matches);
                            }
                        }
                        termHitCache.set(tIdx, found);
                        return found;
                    };

                    if (evalAdsExpr(adsPlan.expr, hasTermInChapter)) {
                        for (const pIdx of posIndices) hasTermInChapter(pIdx);
                        for (const chunk of chChunks) {
                            const raw = [];
                            for (const pIdx of posIndices) {
                                const byChunk = termMatchesByChunk.get(pIdx);
                                const m = byChunk && byChunk.get(chunk.index);
                                if (m && m.length > 0) raw.push(...m);
                            }
                            if (raw.length > 0) {
                                recordChunkMatches(chunk, ch, mergeWasmMatchSpans(raw));
                            }
                        }
                    }

                    if (performance.now() - sliceStart >= 10) {
                        await new Promise(r => setTimeout(r, 0));
                        sliceStart = performance.now();
                    }
                }
            } else {
                const wasmKeywords = adaptKeywordsForWasm(specs, !!sw.weightedKeywords);
                for (let ci = 0; ci < State.chunks.length; ci++) {
                    if (token !== State.activeSearchToken) return null;
                    const chunk = State.chunks[ci];
                    const matches = collectWasmMatches(sw, chunk.text, wasmKeywords, noise, 0);
                    if (matches.length > 0) {
                        recordChunkMatches(chunk, State.chapters[chunk.chapterIdx], matches);
                    }

                    if (performance.now() - sliceStart >= 10) {
                        await new Promise(r => setTimeout(r, 0));
                        sliceStart = performance.now();
                    }
                }
            }

            if (token !== State.activeSearchToken) return null;
            if (useHL) publishSearchHighlights();

            const groups = Array.from(groupMap.values()).sort((a, b) => a.groupIndex - b.groupIndex);
            const truncated = totalHits > hits.length;
            State.lastSearch = { keyword, isAds, hits, groups, groupMap };

            if (canCache && queryKey) {
                const groupMeta = groups.map(g => ({
                    groupIndex: g.groupIndex,
                    title: g.title,
                    percent: g.percent,
                    count: g.count
                }));
                BookDB.putSearch(State.bookKey, queryKey, 'txt', {
                    keyword,
                    isAds,
                    totalHits,
                    truncated,
                    hits,
                    groupMeta
                });
            }

            return {
                keyword,
                totalHits,
                shownHits: hits.length,
                truncated,
                groups
            };
        }

        function getTxtSnippets(path) {
            const last = State.lastSearch;
            if (!last || typeof path !== 'string') return null;

            if (path.startsWith('txt-group:')) {
                const gIdx = Number(path.slice('txt-group:'.length));
                const g = last.groupMap.get(gIdx);
                if (!g) return null;
                const { items, more } = buildMergedGroupSnippets(g.hits, {
                    maxItems: 40,
                    radius: 58,
                    maxWindowChars: 180,
                    snapToNewline: true,
                    getUnitKey: (h) => h.chunkIdx,
                    getUnitText: (h) => (State.chunks[h.chunkIdx] && State.chunks[h.chunkIdx].text) || ''
                });
                return {
                    body: { hits: g.count, more: more + Math.max(0, g.count - g.hits.length), items },
                    comments: { hits: 0, docs: 0, more: 0, items: [] }
                };
            }

            if (path.startsWith('txt-hit:')) {
                const hIdx = Number(path.slice('txt-hit:'.length));
                const h = last.hits[hIdx];
                if (!h) return null;
                const g = last.groupMap.get(h.chapterIdx);
                const it = buildSnippetItem(h, 150, g ? g.hits : [h]);
                return {
                    body: { hits: 1, more: 0, items: it ? [it] : [] },
                    comments: { hits: 0, docs: 0, more: 0, items: [] }
                };
            }
            return null;
        }

        function flashPulseAtRange(range) {
            try {
                const rect = range.getBoundingClientRect();
                if (!rect || (rect.width === 0 && rect.height === 0)) return;
                const el = document.createElement('div');
                el.className = 'txt-hit-pulse';
                el.style.left = (rect.left - 4) + 'px';
                el.style.top = (rect.top - 3) + 'px';
                el.style.width = Math.max(18, rect.width + 8) + 'px';
                el.style.height = Math.max(20, rect.height + 6) + 'px';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1100);
            } catch (_) { }
        }

        function jumpToHitAnchor(hitIndex) {
            const last = State.lastSearch;
            if (!last) return;
            const hit = last.hits[hitIndex];
            if (!hit) return;
            const chunk = State.chunks[hit.chunkIdx];
            if (!chunk || !chunk.textNode) return;

            try {
                const range = document.createRange();
                range.setStart(chunk.textNode, hit.localStart);
                range.setEnd(chunk.textNode, Math.min(chunk.text.length, hit.localEnd));

                if (ensureActiveHitHighlightStyle()) {
                    activeHitHL.clear();
                    activeHitHL.add(range);
                    CSS.highlights.set('txt-active-hit', activeHitHL);
                }

                const rect = range.getBoundingClientRect();
                const sr = stage.getBoundingClientRect();
                const target = stage.scrollLeft + (rect.left - sr.left) - (sr.width - rect.width) / 2;
                const maxScroll = Math.max(0, stage.scrollWidth - stage.clientWidth);
                const clamped = Math.max(0, Math.min(maxScroll, target));
                cancelSmoothScroll();
                stage.scrollLeft = clamped;
                updateProgressHud();
                saveBookHistoryDebounced();
                requestAnimationFrame(() => flashPulseAtRange(range));
            } catch (err) {
                console.warn('[TXT] 锚记跳转异常:', err);
            }
        }

        function registerWithMainSearch() {
            const bridge = window.top && window.top.__TXT_SEARCH_BRIDGE__;
            if (!bridge) return;
            State.provider = {
                title: State.title,
                path: State.fileUrl,
                runSearch: runBookSearch,
                getSnippets: getTxtSnippets,
                jumpTo: jumpToHitAnchor,
                clearHighlights: clearAllSearchHighlights,
                onScopeChange: syncScopeButtonUI
            };
            bridge.register(State.provider);
        }

        // =====================================================================
        // 12. 文档装载与生命周期
        // =====================================================================
        function applyDecodedDocument(forcedEncoding, { keepOffset = false } = {}) {
            const prevOffset = keepOffset ? captureCurrentCharOffset() : (State.history.charOffset || 0);
            const { encoding, text } = decodeChineseBuffer(State.rawBytes, forcedEncoding);
            State.detectedEncoding = encoding;
            State.rawText = text;
            State.lastSearch = null;
            clearAllSearchHighlights();

            const sizeKB = (State.rawBytes.byteLength / 1024).toFixed(0);
            $('#fileMetaSub').textContent = `${sizeKB}KB · ${encoding.toUpperCase()}`;
            $('#encodingSelect').value = forcedEncoding || 'auto';

            parseChaptersAndBuildChunks(text);
            applyPrefs({ reanchor: false });
            updateBookmarkCountUI();

            requestAnimationFrame(() => {
                if (prevOffset > 0) {
                    scrollToCharOffset(prevOffset, { smooth: false, align: 'left' });
                } else if (State.history.scrollLeft > 0 && !keepOffset) {
                    stage.scrollLeft = State.history.scrollLeft;
                } else {
                    stage.scrollLeft = 0;
                }
                updateProgressHud();
            });
        }

        window.addEventListener('pagehide', (e) => {
            saveBookHistoryNow();
            if (!e.persisted) {
                try {
                    const bridge = window.top && window.top.__TXT_SEARCH_BRIDGE__;
                    if (bridge && State.provider) bridge.unregister(State.provider);
                } catch (_) { }
                if (window.__LITE_BUS__) {
                    window.__LITE_BUS__.close();
                    window.__LITE_BUS__ = null;
                }
            }
        });

        async function bootstrap() {
            const savedPrefs = readJSON(PREFS_KEY);
            if (savedPrefs && typeof savedPrefs === 'object') {
                State.prefs = { ...DEFAULT_PREFS, ...savedPrefs };
                // 迁移旧预设名到 light / dark
                if (State.prefs.theme === 'parchment' || State.prefs.theme === 'paper' || State.prefs.theme === 'forest') {
                    State.prefs.theme = 'light';
                }
            }
            applyPrefs({ reanchor: false });
            initTopBarEvents();
            initSelectionTools();
            initFullscreenControl();

            const params = new URLSearchParams(window.location.search);
            const fileUrl = params.get('file');
            if (!fileUrl) {
                stage.innerHTML = '<div class="txt-loading">未指定 TXT 文件路径。</div>';
                return;
            }
            State.fileUrl = fileUrl;
            State.bookKey = normalizeBookKey(fileUrl);
            State.title = decodeURIComponent(fileUrl.split('/').pop() || 'Untitled.txt');
            State.historyKey = 'txt.history_' + State.title;
            document.title = State.title;
            $('#fileTitle').textContent = State.title;
            $('#fileTitle').title = State.title;

            const savedHist = readJSON(State.historyKey);
            if (savedHist && typeof savedHist === 'object') {
                State.history = {
                    ...State.history,
                    ...savedHist,
                    bookmarks: Array.isArray(savedHist.bookmarks) ? savedHist.bookmarks : []
                };
                if (!savedPrefs) {
                    if (savedHist.fontSize) State.prefs.fontSize = Math.round(Number(savedHist.fontSize) * 16) || DEFAULT_PREFS.fontSize;
                    if (savedHist.lineHeight) State.prefs.lineHeight = Number(savedHist.lineHeight) || DEFAULT_PREFS.lineHeight;
                    if (savedHist.color) State.prefs.color = savedHist.color;
                    if (savedHist.backgroundColor) State.prefs.backgroundColor = savedHist.backgroundColor;
                    applyPrefs({ reanchor: false });
                }
            }
            updateBookmarkCountUI();

            try {
                const res = await fetch(fileUrl);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                State.rawBytes = await res.arrayBuffer();
                applyDecodedDocument(State.history.encoding || 'auto', { keepOffset: false });
                registerWithMainSearch();
            } catch (err) {
                stage.innerHTML = `<div class="txt-loading">无法加载文件：${err.message}</div>`;
            }
        }

        window.addEventListener('DOMContentLoaded', bootstrap);
    </script>
</body>

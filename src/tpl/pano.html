<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self';" />
	<title>Panorama</title>
	<meta name="viewport" content="initial-scale=1.0" />
	<script src="../third/photo-sphere-viewer/three.min.js"></script>
	<script src="../third/photo-sphere-viewer/photo-sphere-viewer.min.js"></script>
	<style>
		html,
		body {
			margin: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000;
		}

		#container {
			width: 100%;
			height: 100%;
		}
	</style>
</head>

<body>
	<div id="container"></div>

	<script>
		/**
		 * pano.html 内联逻辑 —— 校验同源 /gallery/ 全景路径并挂载 PhotoSphereViewer
		 */
		(function () {
			const urlParams = new URLSearchParams(window.location.search);
			const rawSrc = (urlParams.get("src") || "").trim();

			if (!rawSrc) {
				alert("No panorama image specified!");
				return;
			}

			let safeUrl;
			try {
				const parsed = new URL(rawSrc, window.location.origin);
				if (
					parsed.origin !== window.location.origin ||
					!parsed.pathname.startsWith("/gallery/") ||
					!/\.(?:jpg|jpeg|png|webp|gif)$/i.test(parsed.pathname)
				) {
					throw new Error("invalid path");
				}
				safeUrl = parsed.pathname;
			} catch (_) {
				alert("Invalid panorama image path!");
				return;
			}

			let titleText = safeUrl.slice("/gallery/".length);
			try { titleText = decodeURIComponent(titleText); } catch (_) { }
			document.title = titleText || "Panorama";

			new PhotoSphereViewer({
				panorama: safeUrl,
				container: document.getElementById("container"),
				time_anim: 1000,
				navbar: true,
				navbar_style: {
					backgroundColor: "rgba(58, 67, 77, 0.7)"
				}
			});
		})();
	</script>
</body>

</html>

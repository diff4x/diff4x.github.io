<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<title></title>
	<meta name="viewport" content="initial-scale=1.0" />
	<script src="../third/photo-sphere-viewer/three.min.js"></script>
	<script src="../third/photo-sphere-viewer/photo-sphere-viewer.min.js"></script>
	<style>
		html,
		body {
			margin: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		#container {
			width: 100%;
			height: 100%;
		}
	</style>
</head>

<body>
	<div id="container"></div>

	<script>
		const urlParams = new URLSearchParams(window.location.search);
        const path = urlParams.get("src");
		document.title = path.split("gallery/")[1];
		
        if (!path) {
            alert("No panorama image specified!");
        } else {
            const PSV = new PhotoSphereViewer({
                panorama: path,
                container: document.getElementById('container'),
                time_anim: 1000,
                navbar: true,
                navbar_style: {
                    backgroundColor: 'rgba(58, 67, 77, 0.7)'
                },
            });
        }

		var PSV = new PhotoSphereViewer({
			panorama: path,
			container: document.getElementById('container'),
			time_anim: 1000,
			navbar: true,
			navbar_style: {
				backgroundColor: 'rgba(58, 67, 77, 0.7)'
			},
		});
	</script>
</body>

</html>

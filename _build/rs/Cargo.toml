[package]
name = "compute_intensive_task_processor"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
regex = "1.10"
js-sys = "0.3"
lazy_static = "1.4"
aho-corasick = "1.1"
lru = "0.12"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
lto = true
opt-level = 'z'
codegen-units = 1
strip = true
panic = 'abort'